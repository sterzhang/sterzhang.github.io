<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=https://andyzworks.github.io/">
    <link rel="canonical" href="https://andyzworks.github.io/">
    <title>Jianshu Zhang — website moved</title>
    <script>
      (() => {
        const destination = new URL(
          window.location.pathname + window.location.search + window.location.hash,
          "https://andyzworks.github.io"
        );
        window.location.replace(destination.href);
      })();
    </script>
  </head>
  <body>
    <p>
      This site has moved to
      <a href="https://andyzworks.github.io/">andyzworks.github.io</a>.
    </p>
  </body>
</html>
